  description: >-
    Real-time identity verification (Verify) and modular identity intelligence
    (Signals) over a shared multi-field request model. Bearer-authenticated REST
    endpoints POST /verify and POST /signals at api.fideo.ai, returning a 0-1
    risk score, session identifier, and an array of identity/risk checks or
    signal categories. Responses are date-versioned via a v=YYYYMMDD query
    parameter.
