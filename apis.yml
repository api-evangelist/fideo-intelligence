aid: fideo-intelligence
name: Fideo Intelligence
description: >-
  Fideo Intelligence is an identity intelligence platform that helps banks,
  fintechs, and financial institutions detect fraud and financial crime in real
  time. Fideo screens billions of transactions annually against an identity
  graph of billions of identities and hundreds of billions of identifiers and
  relationships. Its developer-ready APIs expose two products: Fideo Verify,
  a real-time, AI-powered identity verification and risk-scoring endpoint that
  consolidates many identity and risk checks into a single call for account
  origination, onboarding, account-takeover prevention, and loan-origination
  fraud; and Fideo Signals, modular identity intelligence that enriches existing
  fraud models, risk scoring, investigations, and link analysis. Both products
  share one multi-field request schema and are reached over a bearer-authenticated
  REST API at api.fideo.ai, with date-versioned responses and platform
  integrations for FusionAuth, Auth0, and Maltego.
